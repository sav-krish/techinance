name: Keep Supabase awake

# Free Supabase projects pause after a week of too little database activity,
# which silently breaks sign-in. A small database request every day is a safer
# fit for Supabase's activity guidance than only two requests per week.
#
# NOTE: GitHub disables scheduled workflows in a repository with no commits for
# 60 days, and emails the repo admins first. If Techinance goes quiet for two
# months, re-enable this from the Actions tab or push any commit.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# No repository contents are written and no other job depends on this one.
permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependency install: the script uses only the global fetch and reads
      # supabase-config.js directly, so there is nothing to resolve.
      - name: Ping Supabase
        run: node scripts/supabase-keepalive.mjs
